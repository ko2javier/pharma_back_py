# Ejecuta los 195 tests y, SOLO si pasan, construye la imagen y la sube a
# ghcr.io (el registro de imagenes de GitHub).
#
# Hasta el 12/10/2026 esto era despliegue continuo a secas: publicaba la imagen
# sin comprobar nada, igual que los otros siete repositorios de KO2. Los tests
# existian y no los ejecutaba nadie desde que se escribieron.
#
# Estuvo apuntando a ECR (el registro de AWS) del 11 al 12/10/2026, mientras la
# API vivio en una EC2 de Francfort. Al volver el destino a Hetzner, ECR deja de
# tener sentido: ghcr.io es gratis, vive al lado del codigo y es lo que ya usa
# llm-gateway-resilience. Lo que se aprendio alli esta en ESTRUCTURA.md §11.
#
# No hay ninguna credencial que crear: GITHUB_TOKEN lo genera Actions para esta
# ejecucion y caduca al terminar el job.
#
# OJO con la visibilidad del paquete: el primero que se publica nace PRIVADO,
# aunque el repositorio sea publico. Si el servidor va a bajarselo sin
# autenticarse, hay que ponerlo publico a mano una vez (Packages -> package
# settings -> change visibility).
#
# Desde el 2026-10-18 tambien DESPLIEGA: el ultimo job entra por SSH en el VPS
# y pone la imagen recien publicada en produccion. Un push a master llega a
# produccion -- por eso el repo esta en REPOS_QUE_DESPLIEGAN de guard_push.py.
# Hasta ese dia el despliegue era a mano: el workflow publicaba la imagen y
# nadie avisaba al servidor.

name: Tests, push and deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      # Un cambio de documentacion no cambia la imagen: reconstruirla seria
      # gastar minutos de Actions y una version nueva en el registro para nada. Esto
      # es justo el problema que tiene el repo del back de Java, donde un
      # README reconstruye el contenedor entero.
      - '**.md'
      - '.claude/**'
      - '.idea/**'
  # Para poder lanzarlo a mano desde la pestana Actions sin tocar el codigo,
  # que es comodisimo cuando lo que falla es el despliegue y no el commit.
  workflow_dispatch:

env:
  # ghcr.io, el registro de imagenes de GitHub. El owner tiene que ir en
  # minusculas: ghcr.io las exige y "ko2javier" ya lo esta.
  IMAGEN: ghcr.io/ko2javier/pharma-back-py

jobs:
  # Los 195 tests, y el build NO empieza si alguno falla (lo ata el "needs" de
  # abajo). Esto es lo que separa un despliegue continuo de un CI/CD de verdad:
  # antes, un push rojo publicaba la imagen igual.
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # La MISMA version que el .venv local y que la imagen. Si aqui
          # corriera 3.13 y en produccion 3.14, los tests estarian probando
          # otro interprete.
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        # requirements-dev.txt arrastra con su "-r" las de produccion.
        run: pip install -r requirements-dev.txt

      - name: Ejecutar los tests
        # VALORES DE PEGA, y hacen falta: conftest.py hace "from app.main import
        # app", y eso construye Settings, que exige nueve variables SIN valor por
        # defecto. En local las coge del .env; aqui no hay .env y sin esto la
        # bateria ni arranca (comprobado: ValidationError antes del primer test).
        #
        # Que sean inventados no debilita la prueba: ningun test de los niveles
        # 1 y 2 abre una conexion. SQLAlchemy construye el engine al importar
        # pero es perezoso, y la sesion va siempre sustituida por un mock.
        env:
          PORT: 8001
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
          IA_SERVICE_URL: http://localhost:8000
          IA_SERVICE_API_KEY: test
          ENVIRONMENT: test
        run: pytest -q

  # Nivel 3 (ESTRUCTURA 9 ter): los mismos tests que en local, contra un MySQL
  # de verdad levantado por Testcontainers. Lo que aqui se caza no lo puede ver
  # el job de arriba: las cascadas de las claves ajenas, los NOT NULL y la
  # collation solo existen si hay una base de datos aplicandolos.
  #
  # Va EN PARALELO con "tests", no detras: el reloj cuenta el mas lento de los
  # dos y no la suma. Los dos bloquean la imagen (ver el "needs" de
  # build-and-push).
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar los tests de integracion
        # Las mismas variables de pega que el job de arriba, y por el mismo
        # motivo: importar app.main construye Settings. Aqui ADEMAS son
        # inofensivas porque la sesion la sustituye la fixture de
        # tests/integration/conftest.py, que apunta al contenedor -- estas
        # credenciales no llegan a usarse para conectar con nada.
        #
        # Ryuk (el contenedor de limpieza de testcontainers) se queda ENCENDIDO:
        # solo esta apagado en Windows, donde fallaba al arrancar. Aqui es Linux
        # y funciona, asi que no hay que tocar nada.
        env:
          PORT: 8001
          JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
          IA_SERVICE_URL: http://localhost:8000
          IA_SERVICE_API_KEY: test
          ENVIRONMENT: test
        run: pytest -m integration -q

  build-and-push:
    # Sin esto, los tests correrian EN PARALELO con el build y la imagen se
    # publicaria igual aunque salieran rojos. Son los dos jobs: los 195 con
    # mocks y los de integracion contra MySQL real.
    needs: [tests, integration]
    runs-on: ubuntu-latest

    # packages: write es lo que deja publicar en ghcr.io; contents: read, lo que
    # deja al checkout leer el codigo. Antes habia ademas id-token: write, que
    # era para pedirle el carne OIDC a AWS: ya no hace falta.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Entrar en el registro de GitHub
        # Sin secretos que crear: GITHUB_TOKEN lo genera Actions para esta
        # ejecucion y caduca al terminar el job.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar buildx
        # Sin esto el build falla con "Cache export is not supported for the
        # docker driver". El runner trae por defecto el driver "docker", que
        # construye pero NO sabe exportar cache; el cache-from/cache-to de
        # abajo necesita el driver docker-container, y esta accion es la que
        # lo crea. Solo se nota cuando usas cache: sin ella el build normal
        # funcionaria igual, y por eso es un olvido facil.
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen y subirla
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Dos etiquetas para la MISMA imagen:
          #   latest -> la que se baja el servidor, siempre la ultima
          #   <sha>  -> la del commit exacto, para poder volver atras sabiendo
          #             que version era. Sin esta, "latest" es un agujero
          #             negro: no hay forma de saber que codigo esta corriendo.
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          # Cache entre ejecuciones: sin esto, cada push reinstala las 10
          # dependencias de requirements.txt desde cero (unos 40 s tirados).
          # Sin esto, buildx sube ademas un certificado de procedencia y un
          # indice, y en el registro cada construccion aparece como TRES entradas en
          # vez de una. No lo usamos para nada y descuadra la regla de ciclo
          # de vida, que cuenta imagenes.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decir que ha quedado publicado
        run: |
          echo "Imagen publicada:"
          echo "  ${{ env.IMAGEN }}:latest"
          echo "  ${{ env.IMAGEN }}:${{ github.sha }}"

  # Pone en produccion la imagen que acaba de publicar build-and-push. Solo
  # llega aqui si han pasado los 195 y los de integracion: deploy necesita a
  # build-and-push, y build-and-push necesita a los dos.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    # Dos push seguidos no despliegan a la vez: el segundo espera a que
    # termine el primero, en vez de pisarle el contenedor a medias.
    concurrency:
      group: produccion
      cancel-in-progress: false

    steps:
      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Los mismos tres nombres que usan los demas repos del VPS. La llave
          # es propia de este repo (comentario gha-pharma_back_py en el
          # authorized_keys del servidor): se puede revocar sin tocar las otras.
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Se despliega por el SHA del commit y no por "latest": asi el
          # contenedor dice exactamente que codigo esta corriendo, y volver
          # atras es repetir esto con el SHA anterior:
          #     cd ~/apps/pharma-py && IMAGE_TAG=<sha> docker compose up -d app
          # El docker-compose.yml del servidor ya lee ${IMAGE_TAG:-latest}.
          #
          # Lo que esto NO toca: el docker-compose.yml y el .env del VPS. Si
          # cambian, se siguen copiando a mano -- aqui solo cambia la imagen.
          script: |
            set -e
            cd ~/apps/pharma-py
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull app
            docker compose up -d app

            # Que el contenedor arranque no significa que la API responda. Se
            # espera hasta 30 s a un 200; si no llega, el job sale ROJO y deja
            # el final del log a la vista en Actions.
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5051/ || true)
              if [ "$code" = "200" ]; then
                echo "Desplegado: responde 200 con la imagen $IMAGE_TAG"
                exit 0
              fi
              sleep 2
            done
            echo "La API no responde 200 en 30 s tras desplegar $IMAGE_TAG"
            docker compose logs --tail 40 app
            exit 1
