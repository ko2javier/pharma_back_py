# Construye la imagen y la sube a ghcr.io, el registro de imagenes de GitHub.
#
# Estuvo apuntando a ECR (el registro de AWS) del 11 al 12/10/2026, mientras la
# API vivio en una EC2 de Francfort. Al volver el destino a Hetzner, ECR deja de
# tener sentido: ghcr.io es gratis, vive al lado del codigo y es lo que ya usa
# llm-gateway-resilience. Lo que se aprendio alli esta en ESTRUCTURA.md §11.
#
# No hay ninguna credencial que crear: GITHUB_TOKEN lo genera Actions para esta
# ejecucion y caduca al terminar el job.
#
# OJO con la visibilidad del paquete: el primero que se publica nace PRIVADO,
# aunque el repositorio sea publico. Si el servidor va a bajarselo sin
# autenticarse, hay que ponerlo publico a mano una vez (Packages -> package
# settings -> change visibility).
#
# El despliegue en el servidor todavia NO esta aqui: esto solo deja la imagen
# publicada. El dia que se anada, ese mismo commit tiene que meter el
# repositorio en REPOS_QUE_DESPLIEGAN del hook guard_push.py.

name: Build and push

on:
  push:
    branches:
      - master
    paths-ignore:
      # Un cambio de documentacion no cambia la imagen: reconstruirla seria
      # gastar minutos de Actions y una version nueva en el registro para nada. Esto
      # es justo el problema que tiene el repo del back de Java, donde un
      # README reconstruye el contenedor entero.
      - '**.md'
      - '.claude/**'
      - '.idea/**'
  # Para poder lanzarlo a mano desde la pestana Actions sin tocar el codigo,
  # que es comodisimo cuando lo que falla es el despliegue y no el commit.
  workflow_dispatch:

env:
  # ghcr.io, el registro de imagenes de GitHub. El owner tiene que ir en
  # minusculas: ghcr.io las exige y "ko2javier" ya lo esta.
  IMAGEN: ghcr.io/ko2javier/pharma-back-py

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # packages: write es lo que deja publicar en ghcr.io; contents: read, lo que
    # deja al checkout leer el codigo. Antes habia ademas id-token: write, que
    # era para pedirle el carne OIDC a AWS: ya no hace falta.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Entrar en el registro de GitHub
        # Sin secretos que crear: GITHUB_TOKEN lo genera Actions para esta
        # ejecucion y caduca al terminar el job.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar buildx
        # Sin esto el build falla con "Cache export is not supported for the
        # docker driver". El runner trae por defecto el driver "docker", que
        # construye pero NO sabe exportar cache; el cache-from/cache-to de
        # abajo necesita el driver docker-container, y esta accion es la que
        # lo crea. Solo se nota cuando usas cache: sin ella el build normal
        # funcionaria igual, y por eso es un olvido facil.
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen y subirla
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Dos etiquetas para la MISMA imagen:
          #   latest -> la que se baja el servidor, siempre la ultima
          #   <sha>  -> la del commit exacto, para poder volver atras sabiendo
          #             que version era. Sin esta, "latest" es un agujero
          #             negro: no hay forma de saber que codigo esta corriendo.
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          # Cache entre ejecuciones: sin esto, cada push reinstala las 10
          # dependencias de requirements.txt desde cero (unos 40 s tirados).
          # Sin esto, buildx sube ademas un certificado de procedencia y un
          # indice, y en el registro cada construccion aparece como TRES entradas en
          # vez de una. No lo usamos para nada y descuadra la regla de ciclo
          # de vida, que cuenta imagenes.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decir que ha quedado publicado
        run: |
          echo "Imagen publicada:"
          echo "  ${{ env.IMAGEN }}:latest"
          echo "  ${{ env.IMAGEN }}:${{ github.sha }}"
