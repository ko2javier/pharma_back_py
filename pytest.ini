# pytest.ini — configuracion de la bateria de tests (paso 13).
#
# Equivale a la seccion <plugins> del pom.xml para surefire: no es codigo de
# test, es como se ejecutan.
[pytest]
# pytest-asyncio 1.x NO ejecuta los tests "async def" por defecto: los SALTA
# con un warning, y la bateria sale verde sin haber probado nada. Con "auto"
# no hace falta @pytest.mark.asyncio en cada test.
asyncio_mode = auto

# Un bucle de eventos nuevo por test. Es el valor por defecto, se escribe para
# no depender de que no cambie: por eso las fixtures async del conftest son de
# ambito de funcion (una de ambito de sesion se crearia en un bucle y se usaria
# en otro).
asyncio_default_fixture_loop_scope = function

testpaths = tests

# Nivel 3 (tests/integration): necesitan Docker y tardan segundos, no
# milisegundos. Fuera del "pytest" a secas, para que los 195 sigan en ~1,6 s
# y la CI no necesite Docker. Se lanzan a proposito con:
#     pytest -m integration
# Es el <excludedGroups> de surefire con @Tag("integration") de JUnit 5.
markers =
    integration: requiere Docker (testcontainers). Excluido por defecto.
addopts = -m "not integration"
